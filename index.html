<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1113"><title>Alang-Alang Fieldwork Hub</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=3">  <style id="aa-hidden-safety">
    [hidden], .app-loading[hidden], #app-loading[hidden], #household-loading[hidden] {
      display: none !important;
      visibility: hidden !important;
    }
  </style>
</head><body class="login-page"><main class="login-card"><div class="brand-mark large">AA</div><span class="eyebrow">UPM-SHS · Group Fieldwork</span><h1>Alang-Alang Community Fieldwork Hub</h1><p>Offline household survey, GPS, mapping, community diagnosis, and a shared group calendar.</p><form id="login-form"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button><div id="login-message" class="form-message"></div></form><small class="privacy-note">Group-only access. Use individual accounts; do not share one login for household-level data.</small></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const f=document.getElementById('login-form'),m=document.getElementById('login-message');f.addEventListener('submit',async e=>{e.preventDefault();const c=window.APP_CONFIG||{};if(!window.supabase?.createClient||!c.SUPABASE_URL||c.SUPABASE_URL.includes('YOUR-')){m.textContent='Configure supabase-config.js first.';return;}const s=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);m.textContent='Signing in…';const{data,error}=await s.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){m.textContent=error.message;return;}const u=data.user;const{data:member,error:me}=await s.from('aa_group_members').select('is_active').eq('user_id',u.id).maybeSingle();if(me||!member?.is_active){await s.auth.signOut();m.textContent='This account is not yet an active Alang-Alang group member.';return;}location.replace('dashboard.html');});</script></body></html>
